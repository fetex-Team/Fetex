<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수요 로그 분석기</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--tx:#17212b;--mut:#5f6b78;--bd:#d9dfe5;--ac:#0f6b63;--ac2:#c2410c}
@media(prefers-color-scheme:dark){:root{--bg:#111820;--card:#1a232d;--tx:#e6ebf0;--mut:#93a0ad;--bd:#2c3846;--ac:#3cc2b3;--ac2:#fb923c}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 "맑은 고딕","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:14px 18px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{margin:0 0 8px;font-size:18px}
h3{margin:18px 0 6px;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
label{color:var(--mut)}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:3px 6px}
input[type=number]{width:70px}
.mut{color:var(--mut)}
#champ{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
#champ span{background:var(--ac);color:#fff;padding:3px 10px;border-radius:5px;font-weight:600}
nav{display:flex;gap:2px;padding:10px 18px 0}
nav button{font:inherit;color:var(--mut);background:none;border:0;border-bottom:3px solid transparent;padding:6px 14px;cursor:pointer}
nav button.on{color:var(--tx);border-color:var(--ac);font-weight:600}
nav button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
main{padding:14px 18px 40px}
section{display:none}section.on{display:block}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:10px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px;overflow-x:auto}
canvas{width:100%;height:auto;display:block}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:600}
tr.top td{font-weight:700;background:color-mix(in srgb,var(--ac) 12%,transparent)}
.warn{color:var(--ac2);margin:4px 0}
i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
#zones{display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:8px}
#zones label{color:var(--tx)}
#srvlist label{display:block;color:var(--tx);white-space:nowrap}
#srvlist small{color:var(--mut);margin-left:6px}
#srv button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:2px 10px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>수요 로그 분석기</h1>
  <div class="row">
    <span id="fileInputs" class="row">
      <label>수요 로그 CSV (여러 개) <input type="file" id="fcsv" accept=".csv" multiple></label>
      <label>도로망 grid.net.xml (선택, 지도 배경) <input type="file" id="fnet" accept=".xml"></label>
    </span>
    <label>타임아웃 페널티(초) <input type="number" id="pen" value="500" min="0"></label>
    <span class="mut" id="info">data/sim_logs의 demand_log_*.csv를 골라 주세요.</span>
  </div>
  <div id="srv" style="display:none;margin-top:8px">
    <div class="row" style="margin-bottom:4px"><b>로그 선택</b>
      <button data-sel="all">전체</button><button data-sel="none">해제</button>
      <button data-sel="wk">평일만</button><button data-sel="hd">공휴일만</button>
      <span class="mut" id="srvmsg">체크하면 바로 반영돼요.</span></div>
    <div id="srvlist" class="card" style="max-height:170px;overflow-y:auto;padding:6px 10px"></div>
  </div>
  <div id="warn" class="warn"></div>
  <div id="champ"></div>
</header>
<nav id="tabs">
  <button data-t="t1" class="on">출발 지도</button>
  <button data-t="t2">순위</button>
  <button data-t="t3">시간대별</button>
</nav>
<main>
  <div class="bar">
    <label>시간 <select id="h0"></select>시 이상 ~ <select id="h1"></select>시 미만</label>
    <label>날짜 종류 <select id="dtype"><option value="all">전체</option><option value="wk">평일만</option><option value="hd">공휴일·주말만</option></select></label>
    <label id="statwrap">상태 <select id="stat"><option value="all">전체</option><option value="picked">탑승</option><option value="timeout">타임아웃</option><option value="unpicked">못 탐</option></select></label>
  </div>

  <section id="t1" class="on">
    <div class="bar">
      <label>보기 <select id="mode"><option value="dots">점 (구역별 색)</option><option value="heat">밀집도</option></select></label>
      <span id="cnt" class="mut"></span>
    </div>
    <div id="zones"></div>
    <div class="grid">
      <div class="card"><canvas id="cv" width="900" height="600"></canvas>
        <div class="mut">로그에는 출발 위치만 있어 도착지는 지도에 안 나와요. 도착은 오른쪽 표에 카테고리로 보여줘요.</div></div>
      <div>
        <div class="card"><table id="zt"></table></div>
        <div class="card" style="margin-top:10px"><table id="ft"></table></div>
      </div>
    </div>
  </section>

  <section id="t2">
    <label><input type="checkbox" id="common" checked> 모든 그룹에 있는 날짜만 비교 (같은 날 수요끼리 비교)</label>
    <p class="mut">순위는 위에서 고른 시간대·날짜 종류 기준이에요. 평균 대기 = (탑승자 대기시간 합 + 타임아웃 건수 × 페널티) ÷ (탑승 + 타임아웃). 파일명에 전략·알고리즘이 들어간 로그만 쓰여요.</p>
    <div id="rank"></div>
  </section>

  <section id="t3">
    <h3>시간대별 호출 수</h3><div class="card"><canvas id="c1" width="900" height="220"></canvas></div>
    <h3>시간대별 평균 대기 (초, 페널티 포함)</h3><div class="card"><canvas id="c2" width="900" height="220"></canvas></div>
    <p class="mut">파란 막대가 위에서 고른 시간대예요.</p>
  </section>
</main>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const PEN=()=>+$('#pen').value||500;
const PAL=['#d6336c','#2f9e44','#1c7ed6','#f08c00','#7048e8','#0c8599','#e8590c','#5c940d','#9c36b5','#495057'];
const zc={};
const col=z=>zc[z]||(zc[z]=PAL[Object.keys(zc).length%PAL.length]);
let runs=[],roads=null,zoneOn=new Set(),zoneOff=new Set(),hoursTouched=false;

function csv(t){
  t=t.replace(/^\uFEFF/,'');
  const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){r.push(f);f=''}
    else if(c==='\n'){r.push(f);rows.push(r);r=[];f=''}
    else if(c!=='\r')f+=c;
  }
  if(f!==''||r.length){r.push(f);rows.push(r)}
  return rows;
}
// demand_log_{구역}{전략}_{알고리즘}[공휴일]{yymmdd}.csv
function parseName(n){
  const m=n.match(/^demand_log_(.+?)(patrol|prepositioned|rl_prepositioned)_(custom_greedy|custom_routeExtension|greedy|routeExtension|hungarian)(공휴일)?(\d{6})\.csv$/);
  if(!m)return null;
  const d=m[5];
  return{region:m[1],strategy:m[2],algo:m[3],hol:!!m[4],date:'20'+d.slice(0,2)+'-'+d.slice(2,4)+'-'+d.slice(4)};
}
function warn(t){$('#warn').innerHTML+=t+'<br>'}

async function loadCsv(files){
  $('#warn').innerHTML='';
  for(const f of files){
    const rs=csv(await f.text());
    if(rs.length<2)continue;
    const h=rs[0].map(s=>s.trim()),I=k=>h.indexOf(k);
    const iD=I('pickup_datetime'),iZ=I('origin_zone'),iT=I('dest_category'),iX=I('x'),iY=I('y'),iW=I('wait_sec'),iS=I('status');
    if(iD<0){warn(f.name+': pickup_datetime 컬럼이 없어 건너뛰었어요.');continue}
    const rows=[];
    for(let k=1;k<rs.length;k++){
      const r=rs[k];
      if(r.length<h.length-2)continue;
      const dt=r[iD]||'';
      rows.push({h:+dt.slice(11,13),zone:(iZ>=0&&r[iZ])||'none',dest:(iT>=0&&r[iT])||'(미기록)',
        x:iX>=0?parseFloat(r[iX]):NaN,y:iY>=0?parseFloat(r[iY]):NaN,
        wait:iW>=0?parseFloat(r[iW]):NaN,status:(iS>=0&&r[iS])||'unpicked'});
    }
    const nm=parseName(f.name)||{};
    const date=nm.date||(rs[1][iD]||'').slice(0,10);
    const hol=!!nm.hol||[0,6].includes(new Date(date+'T00:00:00').getDay());
    runs=runs.filter(r=>r.name!==f.name);
    runs.push({name:f.name,strategy:nm.strategy||'',algo:nm.algo||'',date,hol,rows,named:!!nm.strategy});
    if(!nm.strategy)warn(f.name+': 파일명에서 전략·알고리즘을 못 읽어 순위에서는 빠져요.');
  }
  if(!hoursTouched)fitHours();
  refresh();
}
// 로그에 있는 시각 범위(예: 9~22시대 -> 9 이상 23 미만)를 기본 선택으로
function fitHours(){
  let lo=24,hi=-1;
  for(const r of runs)for(const o of r.rows)if(o.h>=0&&o.h<24){if(o.h<lo)lo=o.h;if(o.h>hi)hi=o.h}
  if(hi<0)return;
  $('#h0').value=lo;$('#h1').value=hi+1;
}
async function loadNet(f){
  const x=new DOMParser().parseFromString(await f.text(),'text/xml');
  const segs=[],b=[1e18,1e18,-1e18,-1e18];
  x.querySelectorAll('edge').forEach(e=>{
    if(e.getAttribute('function')==='internal')return;
    const l=e.querySelector('lane');
    if(!l||!l.getAttribute('shape'))return;
    const p=l.getAttribute('shape').trim().split(/\s+/).map(s=>s.split(',').map(Number));
    segs.push(p);
    p.forEach(q=>{b[0]=Math.min(b[0],q[0]);b[1]=Math.min(b[1],q[1]);b[2]=Math.max(b[2],q[0]);b[3]=Math.max(b[3],q[1])});
  });
  roads=segs.length?{segs,b}:null;
  if(!roads)warn('도로망에서 도로를 읽지 못했어요.');
  draw();
}

const hr=()=>[+$('#h0').value,+$('#h1').value];
function selAll(){
  const dt=$('#dtype').value,st=$('#stat').value,out=[];
  for(const r of runs){
    if((dt==='wk'&&r.hol)||(dt==='hd'&&!r.hol))continue;
    for(const o of r.rows)if(st==='all'||o.status===st)out.push(o);
  }
  return out;
}
function sel(){const[a,b]=hr();return selAll().filter(o=>o.h>=a&&o.h<b)}
const pc=(a,n)=>n?(a/n*100).toFixed(1)+'%':'-';
function stat(rows){
  let s=0,p=0,to=0,n=0;const pen=PEN();
  for(const o of rows){
    n++;
    if(o.status==='picked'&&isFinite(o.wait)){s+=o.wait;p++}
    else if(o.status==='timeout')to++;
  }
  const d=p+to;
  return{n,p,to,avg:d?(s+pen*to)/d:null};
}

function refresh(){
  const zs=new Set();
  runs.forEach(r=>r.rows.forEach(o=>zs.add(o.zone)));
  const zl=[...zs].sort();
  zoneOn=new Set(zl.filter(z=>!zoneOff.has(z)));
  $('#zones').innerHTML=zl.map(z=>`<label><input type="checkbox" data-z="${z}" ${zoneOn.has(z)?'checked':''}><i style="background:${col(z)}"></i>${z}</label>`).join('');
  $$('#zones input').forEach(c=>c.onchange=()=>{if(c.checked){zoneOn.add(c.dataset.z);zoneOff.delete(c.dataset.z)}else{zoneOn.delete(c.dataset.z);zoneOff.add(c.dataset.z)}draw()});
  const total=runs.reduce((a,r)=>a+r.rows.length,0);
  $('#info').textContent=runs.length?`로그 ${runs.length}개(평일 ${runs.filter(r=>!r.hol).length} · 공휴일·주말 ${runs.filter(r=>r.hol).length}) · 호출 ${total.toLocaleString()}건 · 날짜 ${new Set(runs.map(r=>r.date)).size}일`:'data/sim_logs의 demand_log_*.csv를 골라 주세요.';
  all();
}
function all(){draw();rank();hourly()}

function draw(){
  const cv=$('#cv'),g=cv.getContext('2d'),W=cv.width,H=cv.height;
  g.clearRect(0,0,W,H);
  const rows=sel(),pts=rows.filter(o=>zoneOn.has(o.zone)&&isFinite(o.x)&&isFinite(o.y));
  sideStats(rows,pts);
  let bb=roads?roads.b:null;
  if(!bb){
    bb=[1e18,1e18,-1e18,-1e18];
    for(const r of runs)for(const o of r.rows)if(isFinite(o.x)&&isFinite(o.y)){
      bb[0]=Math.min(bb[0],o.x);bb[1]=Math.min(bb[1],o.y);bb[2]=Math.max(bb[2],o.x);bb[3]=Math.max(bb[3],o.y);
    }
    if(bb[0]>bb[2]){g.fillStyle='#888';g.font='16px sans-serif';g.fillText('표시할 출발 위치가 없어요.',20,40);return}
  }
  const s=Math.min((W-20)/((bb[2]-bb[0])||1),(H-20)/((bb[3]-bb[1])||1));
  const X=x=>10+(x-bb[0])*s,Y=y=>H-10-(y-bb[1])*s;
  if(roads){
    g.strokeStyle='rgba(140,155,170,.55)';g.lineWidth=1;g.beginPath();
    roads.segs.forEach(p=>p.forEach((q,i)=>i?g.lineTo(X(q[0]),Y(q[1])):g.moveTo(X(q[0]),Y(q[1]))));
    g.stroke();
  }
  if($('#mode').value==='heat'){
    const c={};let m=1;
    pts.forEach(o=>{const k=((X(o.x)/10)|0)+','+((Y(o.y)/10)|0);c[k]=(c[k]||0)+1;if(c[k]>m)m=c[k]});
    for(const k in c){
      const[i,j]=k.split(',');
      g.fillStyle=`rgba(220,38,38,${Math.min(1,.15+.85*c[k]/m)})`;
      g.fillRect(i*10,j*10,10,10);
    }
  }else{
    g.globalAlpha=.55;
    pts.forEach(o=>{g.fillStyle=col(o.zone);g.beginPath();g.arc(X(o.x),Y(o.y),3,0,7);g.fill()});
    g.globalAlpha=1;
  }
}
function sideStats(rows,pts){
  const[a,b]=hr(),z={},f={};
  rows.forEach(o=>{(z[o.zone]=z[o.zone]||[]).push(o);const k=o.zone+' → '+o.dest;f[k]=(f[k]||0)+1});
  $('#cnt').textContent=`${a}~${b}시 · 호출 ${rows.length.toLocaleString()}건 (지도 표시 ${pts.length.toLocaleString()}건)`;
  $('#zt').innerHTML='<tr><th>출발 구역 (대기 긴 순)<th>호출<th>평균 대기<th>타임아웃</tr>'+
    Object.entries(z).map(([k,v])=>({k,s:stat(v)})).sort((p,q)=>(q.s.avg||0)-(p.s.avg||0)).map(x=>
      `<tr><td><i style="background:${col(x.k)}"></i>${x.k}<td>${x.s.n.toLocaleString()}<td>${x.s.avg==null?'-':x.s.avg.toFixed(0)+'초'}<td>${pc(x.s.to,x.s.n)}</tr>`).join('');
  $('#ft').innerHTML='<tr><th>출발 구역 → 도착 카테고리<th>건수</tr>'+
    Object.entries(f).sort((p,q)=>q[1]-p[1]).slice(0,12).map(([k,v])=>`<tr><td>${k}<td>${v.toLocaleString()}</tr>`).join('');
}

function rank(){
  const[a,b]=hr(),dt=$('#dtype').value,box=$('#rank'),champ=$('#champ');
  const rs=runs.filter(r=>r.named&&!((dt==='wk'&&r.hol)||(dt==='hd'&&!r.hol)));
  champ.innerHTML='';
  if(!rs.length){box.innerHTML='<p class="mut">전략·알고리즘이 파일명에 들어간 로그가 필요해요. 예: demand_log_강남역patrol_hungarian261003.csv</p>';return}
  const defs=[['택시 전략',r=>r.strategy],['배차 알고리즘',r=>r.algo],['조합 (전략 + 알고리즘)',r=>r.strategy+' + '+r.algo]];
  const common=$('#common').checked;
  let h='';const champs=[];
  for(const[title,kf]of defs){
    let use=rs,note='';
    const ds={};
    rs.forEach(r=>{(ds[kf(r)]=ds[kf(r)]||new Set()).add(r.date)});
    const sets=Object.values(ds);
    if(sets.length>1){
      const inter=[...sets[0]].filter(d=>sets.every(s=>s.has(d)));
      if(common){
        if(inter.length)use=rs.filter(r=>inter.includes(r.date));
        else note='모든 그룹에 있는 날짜가 없어 전체 로그로 계산했어요. 날짜가 달라 공정하지 않을 수 있어요.';
      }else if(sets.some(s=>s.size!==inter.length))note='그룹마다 로그 날짜가 달라 공정하지 않을 수 있어요. "같은 날짜만 비교"를 켜는 걸 권해요.';
    }
    const g={};
    for(const r of use){
      const k=kf(r),o=g[k]=g[k]||{rows:[],bd:{}};
      const rr=r.rows.filter(x=>x.h>=a&&x.h<b);
      o.rows=o.rows.concat(rr);
      o.bd[r.date]=(o.bd[r.date]||[]).concat(rr);
    }
    const wins={};
    for(const d of new Set(use.map(r=>r.date))){
      let best=null,bv=1e18,cnt=0;
      for(const k in g){
        const rows=g[k].bd[d];
        if(!rows)continue;
        cnt++;
        const s=stat(rows);
        if(s.avg!=null&&s.avg<bv){bv=s.avg;best=k}
      }
      if(cnt>1&&best)wins[best]=(wins[best]||0)+1;
    }
    const list=Object.keys(g).map(k=>({k,s:stat(g[k].rows),w:wins[k]||0,days:Object.keys(g[k].bd).length}))
      .filter(x=>x.s.avg!=null).sort((p,q)=>p.s.avg-q.s.avg);
    if(list.length)champs.push(title.split(' ')[0]+' 1위: '+list[0].k);
    h+=`<h3>${title}</h3>${note?`<p class="warn">${note}</p>`:''}`+
      '<div class="card"><table><tr><th>순위<th>이름<th>평균 대기(페널티 포함)<th>타임아웃률<th>탑승률<th>호출 수<th>로그 일수<th>날짜별 1위</tr>'+
      list.map((x,i)=>`<tr${i?'':' class="top"'}><td>${i?i+1:'🥇'}<td>${x.k}<td>${x.s.avg.toFixed(1)}초 (${(x.s.avg/60).toFixed(1)}분)<td>${pc(x.s.to,x.s.n)}<td>${pc(x.s.p,x.s.n)}<td>${x.s.n.toLocaleString()}<td>${x.days}<td>${x.w}</tr>`).join('')+
      '</table></div>';
  }
  box.innerHTML=h;
  champ.innerHTML=champs.map(c=>`<span>🥇 ${c}</span>`).join('');
}

function bars(cv,vals,fmt,a,b){
  const g=cv.getContext('2d'),W=cv.width,H=cv.height,m=Math.max(...vals,1),bw=(W-20)/24;
  g.clearRect(0,0,W,H);g.font='11px sans-serif';g.textAlign='center';
  vals.forEach((v,i)=>{
    const h=(H-36)*v/m;
    g.fillStyle=i>=a&&i<b?'#1c7ed6':'#8d99a6';
    g.fillRect(10+i*bw+2,H-18-h,bw-4,h);
    g.fillStyle='#7b8794';
    g.fillText(i,10+i*bw+bw/2,H-4);
    if(v)g.fillText(fmt(v),10+i*bw+bw/2,H-21-h);
  });
}
function hourly(){
  const[a,b]=hr(),by=Array.from({length:24},()=>[]);
  selAll().forEach(o=>{if(o.h>=0&&o.h<24)by[o.h].push(o)});
  bars($('#c1'),by.map(x=>x.length),v=>v,a,b);
  bars($('#c2'),by.map(x=>stat(x).avg||0),v=>Math.round(v),a,b);
}

for(const id of['h0','h1'])$('#'+id).innerHTML=Array.from({length:25},(_,i)=>`<option value="${i}">${i}</option>`).join('');
$('#h0').value=0;$('#h1').value=24;
['h0','h1','dtype','stat','mode','common','pen'].forEach(id=>$('#'+id).onchange=all);
['h0','h1'].forEach(id=>$('#'+id).addEventListener('change',()=>hoursTouched=true));
$('#fcsv').onchange=e=>loadCsv([...e.target.files]);
$('#fnet').onchange=e=>e.target.files[0]&&loadNet(e.target.files[0]);

// ── 서버 모드: analyzer_server.py가 띄운 경우 로그 목록을 자동으로 받아 체크박스로 고름 ──
let busy=false,again=false,tm=null;
async function loadSelected(){
  if(busy){again=true;return}
  busy=true;
  try{
    do{
      again=false;
      const names=$$('#srvlist input:checked').map(c=>c.dataset.n);
      try{localStorage.setItem('demand_sel',JSON.stringify(names))}catch(e){}
      runs=[];
      $('#info').textContent='불러오는 중...';
      await loadCsv(names.map(n=>({name:n,text:()=>fetch('logs/'+encodeURIComponent(n)).then(r=>r.text())})));
    }while(again);
  }finally{busy=false}
}
async function initServer(){
  let list;
  try{const r=await fetch('api/logs');if(!r.ok)return;list=await r.json()}catch(e){return}
  if(!Array.isArray(list))return;
  $('#fileInputs').style.display='none';
  $('#srv').style.display='';
  if(!list.length){$('#srvmsg').textContent='data/sim_logs에 demand_log_*.csv가 아직 없어요.';return}
  let saved=null;
  try{const v=JSON.parse(localStorage.getItem('demand_sel')||'null');if(Array.isArray(v))saved=new Set(v)}catch(e){}
  const isHol=n=>{const m=parseName(n);if(!m)return null;return m.hol||[0,6].includes(new Date(m.date+'T00:00:00').getDay())};
  $('#srvlist').innerHTML=list.map(f=>{
    const m=parseName(f.name),h=isHol(f.name);
    const on=saved?saved.has(f.name):true;
    const tag=h===null?'(구형식)':(h?'공휴일':'평일');
    const nm=m?`${m.region}${m.strategy}_${m.algo}`:f.name.replace(/^demand_log_|\.csv$/g,'');
    return `<label><input type="checkbox" data-n="${f.name.replace(/"/g,'&quot;')}" ${on?'checked':''}> ${f.date||''} · ${tag} · ${nm}<small>${(f.size/1024).toFixed(0)}KB</small></label>`;
  }).join('');
  $$('#srvlist input').forEach(c=>c.onchange=()=>{clearTimeout(tm);tm=setTimeout(loadSelected,350)});
  $$('#srv button').forEach(b=>b.onclick=()=>{
    const k=b.dataset.sel;
    $$('#srvlist input').forEach(c=>{
      const h=isHol(c.dataset.n);
      c.checked=k==='all'?true:k==='none'?false:k==='wk'?h===false:h===true;
    });
    clearTimeout(tm);tm=setTimeout(loadSelected,100);
  });
  loadSelected();
  // 도로망(지도 배경)은 있으면 자동으로
  try{const r=await fetch('api/net');if(r.ok){const t=await r.text();loadNet({text:()=>Promise.resolve(t)})}}catch(e){}
}
initServer();
$$('#tabs button').forEach(bt=>bt.onclick=()=>{
  $$('#tabs button').forEach(x=>x.classList.toggle('on',x===bt));
  $$('section').forEach(s=>s.classList.toggle('on',s.id===bt.dataset.t));
  $('#statwrap').style.display=bt.dataset.t==='t2'?'none':'';
});
</script>
